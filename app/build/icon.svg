<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Night-indigo neuron constellation — the GitHub hero's identity recomposed
       for a square: Cajal soma + dendrites in lavender ink, dendrite tips
       hairlined into a concept-graph constellation (cream = consolidated),
       axon sweeping out bottom-right with amber signal sparks. qlmanage-safe:
       gradients/paths/circles only, no filters/masks/clipPaths — the squircle
       alpha is applied by build-icons.sh from the first path below. -->
  <defs>
    <radialGradient id="field" cx="42%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#221c3a"/>
      <stop offset="100%" stop-color="#0f0c1c"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a99ef0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a99ef0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-cream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3ecd9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f3ecd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a857" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8a857" stop-opacity="0"/>
    </radialGradient>
  </defs>

